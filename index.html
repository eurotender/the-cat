<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scenic Route</title>
<meta name="description" content="Build multimedia scavenger hunts, guided tours and quizzes. One file, no account, no server.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;family=Spectral:ital,wght@0,400;0,600;1,400;1,600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#08304C; --ink-soft:#3A6A8C; --paper:#FBFAF7;
  --shoal:#DCEAF3; --shoal-deep:#B6D2E4; --sand:#FFF6CC;
  --accent:#0068A7; --accent-tint:#E2F0F9; --accent-dark:#00537F;
  --gold:#FFE01B; --gold-deep:#D9BC00;
  --rule:#BFD5E2; --ok:#1F6B4F; --ok-bg:#DDEDE4; --warn:#8A4B0B; --warn-bg:#F7E9DC;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Barlow Semi Condensed","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.45; -webkit-text-size-adjust:100%; min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='300' viewBox='0 0 420 300'><g fill='none' stroke='%2308304C' stroke-opacity='0.07' stroke-width='1'><path d='M-20 60 C 80 10, 180 110, 300 50 S 460 30, 480 90'/><path d='M-20 110 C 90 60, 190 160, 310 100 S 460 80, 480 140'/><path d='M-20 170 C 100 120, 200 220, 320 160 S 460 140, 480 200'/><path d='M-20 240 C 110 190, 210 290, 330 230 S 460 210, 480 270'/></g></svg>");
}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 20px 90px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.15}
.placename{font-family:Spectral,Georgia,"Times New Roman",serif;font-style:italic;font-weight:600}
.lede{font-size:1.05rem;color:var(--ink-soft);max-width:62ch}
.tiny{font-size:.86rem;color:var(--ink-soft)}
a{color:var(--accent)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--shoal);padding:1px 4px;border-radius:2px}

.masthead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 0 14px;border-bottom:2px solid var(--ink)}
.mark{display:flex;align-items:center;gap:9px;font-size:1.15rem;font-weight:700}
.masthead .spacer{flex:1}

button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;min-height:44px;
  border:1.5px solid var(--ink);border-radius:var(--r);background:var(--paper);color:var(--ink);font-weight:600;
  cursor:pointer;text-decoration:none}
.btn:hover{background:var(--shoal)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:#143252}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.go:hover{background:var(--accent-dark)}
.btn.quiet{border-color:var(--rule);font-weight:500}
.btn.quiet:hover{background:var(--shoal)}
.btn.danger{border-color:var(--rule);color:var(--warn);font-weight:500}
.btn.danger:hover{background:var(--warn-bg)}
.btn.big{font-size:1.1rem;padding:14px 22px;min-height:54px;width:100%}
.btn.sm{padding:6px 10px;min-height:36px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

label{display:block;font-size:.9rem;font-weight:600;margin:0 0 5px}
.field{margin:0 0 16px}
input[type=text],input[type=number],input[type=password],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--rule);
  border-radius:var(--r);padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.hint{font-size:.85rem;color:var(--ink-soft);margin:4px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.inline{display:flex;align-items:center;gap:8px}
.inline label{margin:0;font-weight:500}
.check{display:flex;align-items:center;gap:8px;min-height:40px}
.check input{accent-color:var(--accent);width:20px;height:20px;flex:none}
.check label{margin:0;font-weight:500}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills label{margin:0;display:flex;align-items:center;gap:7px;padding:8px 12px;min-height:42px;
  border:1.5px solid var(--rule);border-radius:var(--r);cursor:pointer;font-weight:500;background:#fff}
.pills input{accent-color:var(--accent);margin:0}
.pills label:has(input:checked){border-color:var(--ink);background:var(--shoal);font-weight:600}
.pills label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

.build-grid{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start;margin-top:22px}
.ellist{border-top:1px solid var(--rule)}
.ellist ol{margin:0;padding:0}
.ellist li{list-style:none}
.elrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 8px;background:none;
  border:0;border-bottom:1px solid var(--rule);cursor:pointer;min-height:46px}
.elrow:hover{background:var(--shoal)}
.elrow.on{background:var(--ink);color:var(--paper)}
.elrow.on .glyph{border-color:var(--paper);color:var(--paper)}
.elrow:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.elrow.sect{background:var(--sand);font-weight:700;border-bottom:1.5px solid var(--ink-soft)}
.elrow.sect.on{background:var(--ink)}
.elrow.indent{padding-left:22px}
.glyph{flex:none;width:24px;height:24px;border:1.5px solid currentColor;border-radius:var(--r);
  display:grid;place-items:center;font-size:.72rem;font-weight:700}
.elname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elmeta{flex:none;font-size:.76rem;opacity:.75}

.panel{border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;padding:20px}
.panel + .panel{margin-top:18px}
.panelhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:0 0 12px;border-bottom:1px solid var(--rule)}
.panelhead h2{font-size:1.3rem}
.panelhead .spacer{flex:1}
.sub{border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin:0 0 16px;background:#FCFDFD}
.sub > h3{font-size:1rem;margin:0 0 10px}

.tabs{display:flex;gap:0;margin:18px 0 0;border-bottom:2px solid var(--ink);overflow-x:auto}
.tab{padding:10px 15px;min-height:44px;background:none;border:0;border-bottom:4px solid transparent;
  margin-bottom:-3px;cursor:pointer;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}

.empty{border:1.5px dashed var(--rule);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--ink-soft)}
.empty p{margin:0 0 14px}

.addmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.addmenu button{text-align:left;padding:10px 12px;border:1.5px solid var(--rule);border-radius:var(--r);
  background:#fff;cursor:pointer;min-height:56px}
.addmenu button:hover{border-color:var(--ink);background:var(--shoal)}
.addmenu b{display:block;font-size:.98rem}
.addmenu span{font-size:.8rem;color:var(--ink-soft)}

/* ---- player ---- */
.play-wrap{max-width:660px;margin:0 auto}
.punch{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.pip{width:18px;height:18px;transform:rotate(45deg);border:1.5px solid var(--ink-soft);flex:none}
.pip.done{background:var(--gold);border-color:var(--gold-deep);position:relative}
.pip.done::after{content:"";position:absolute;inset:4px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(-90deg) scale(.9)}
.pip.miss{background:var(--warn-bg);border-color:var(--warn)}
.pip.now{border-color:var(--accent);border-width:2.5px;box-shadow:0 0 0 3px var(--accent-tint)}
.stage{border:2px solid var(--ink);border-radius:var(--r);background:#fff;padding:22px;margin:16px 0 0}
.stage h2{font-size:1.55rem}
.stagehead{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.body{font-size:1.15rem;line-height:1.5;white-space:pre-wrap;margin:12px 0 0}
.media{margin:16px 0 0}
.media img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:var(--r)}
.media audio,.media video{width:100%;margin-top:10px;display:block}
.media figcaption{font-size:.85rem;color:var(--ink-soft);margin-top:6px}
.answerbox{margin:20px 0 0;padding:18px 0 0;border-top:1px solid var(--rule)}
.answerbox input[type=text]{font-size:1.15rem;min-height:52px}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1.5px solid var(--rule);
  border-radius:var(--r);background:#fff;cursor:pointer;text-align:left;min-height:50px;width:100%}
.choice:hover{border-color:var(--ink);background:var(--shoal)}
.choice.picked{border-color:var(--accent);background:var(--accent-tint);font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--warn);background:var(--warn-bg)}
.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.orderlist{display:grid;gap:7px}
.orderrow{display:flex;align-items:center;gap:8px;border:1.5px solid var(--rule);border-radius:var(--r);
  padding:8px 10px;background:#fff;min-height:50px}
.orderrow .txt{flex:1}
.spotwrap{position:relative;display:inline-block;max-width:100%;cursor:crosshair;touch-action:manipulation}
.spotwrap img{display:block;max-width:100%;height:auto;border:1.5px solid var(--rule);border-radius:var(--r)}
.marker{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid var(--accent);
  border-radius:50%;background:rgba(181,23,92,.22);pointer-events:none}
.marker.target{border-color:var(--ok);background:rgba(31,107,79,.2)}
.flash{margin:14px 0 0;padding:12px 14px;border-radius:var(--r);border-left:5px solid var(--rule);
  background:var(--shoal);font-weight:600;white-space:pre-wrap}
.flash.bad{border-left-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.flash.good{border-left-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.flash.info{border-left-color:var(--accent);background:var(--accent-tint);color:var(--accent-dark)}
.scorebar{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin:12px 0 0;font-size:.95rem;color:var(--ink-soft)}
.scorebar b{font-size:1.2rem;color:var(--ink);font-weight:700}
.countdown{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.countdown.low{color:var(--warn)}
#map{height:280px;border:1.5px solid var(--ink);border-radius:var(--r);margin:16px 0 0}
.compass{display:flex;align-items:center;gap:16px;margin:16px 0 0;padding:14px;border:1.5px solid var(--rule);border-radius:var(--r)}
.needle{width:74px;height:74px;flex:none;border:2px solid var(--ink);border-radius:50%;position:relative;background:#fff}
.needle i{position:absolute;left:50%;top:50%;width:0;height:0;margin-left:-9px;margin-top:-30px;
  border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:30px solid var(--accent);
  transform-origin:50% 100%;transition:transform .18s linear}
.dist{font-size:1.6rem;font-weight:700;line-height:1}
.finish{text-align:center;padding:26px 20px}
.finish .bignum{font-family:Spectral,Georgia,serif;font-size:4rem;line-height:1;font-weight:600;display:inline-block;background:var(--gold);color:var(--ink);padding:6px 26px;border-radius:var(--r)}
.linkbox{display:block;width:100%;font-size:.82rem;word-break:break-all;background:var(--shoal);
  border:1px solid var(--shoal-deep);border-radius:var(--r);padding:12px;max-height:130px;overflow:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace}
#qrbox{margin:16px 0 0;display:flex;justify-content:center}
#qrbox img,#qrbox canvas{border:10px solid #fff;outline:1px solid var(--rule)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:18px 0 0}
.card{border:2px dashed var(--ink-soft);border-radius:var(--r);padding:16px;text-align:center;background:#fff}
.card .code{font-size:1.8rem;font-weight:700;letter-spacing:.05em;margin:8px 0 0;word-break:break-word}
.card .qr{margin:12px auto 0;width:132px}
.card .qr img,.card .qr canvas{width:100%;height:auto}
table.grid{width:100%;border-collapse:collapse;margin-top:14px;font-size:.95rem}
table.grid th,table.grid td{border-bottom:1px solid var(--rule);padding:9px 8px;text-align:left}
table.grid th{font-size:.85rem;color:var(--ink-soft)}
table.grid tr.top td{background:var(--accent-tint);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:78px;height:78px;object-fit:cover;border:1px solid var(--rule);border-radius:var(--r)}
.scan{position:relative;margin-top:14px}
.scan video{width:100%;border:1.5px solid var(--ink);border-radius:var(--r);background:#000;display:block}
@media print{
  body::before,.masthead,.tabs,.noprint{display:none !important}
  body{background:#fff;font-size:12pt}
  .wrap{max-width:none;padding:0}
  .cards{grid-template-columns:repeat(2,1fr)}
  .card{break-inside:avoid;page-break-inside:avoid}
}
@media (max-width:860px){
  .build-grid{grid-template-columns:1fr;gap:18px}
  .two,.three{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.brandmark{height:34px;width:auto;display:block;flex:none}
.sitefoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:44px 0 0;padding:16px 0 0;
  border-top:1px solid var(--rule);color:var(--ink-soft);font-size:.85rem}
.sitefoot img{height:26px;width:auto;flex:none}
.finish .brandblock{margin:26px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.finish .brandblock img{height:66px;width:auto}
.joinbrand{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.joinbrand img{height:46px;width:auto;flex:none}
.hidden{display:none !important}

/* ============================================================
   NIGHT SCHEME — Last Seen Dancing
   The game runs from dusk to dawn and is played outdoors in the
   dark. Amber is for doing something; blue is the cat, and where
   you are. Everything else stays quiet.
   ============================================================ */
:root{
  --ink:#E7ECF6; --ink-soft:#94A1BC; --paper:#0B1018; --slate:#151D2B;
  --shoal:#1B2437; --shoal-deep:#2B3855; --sand:#2A2312;
  --accent:#F2A63E; --accent-tint:#2C2214; --accent-dark:#D98F26;
  --gold:#7FA9F2; --gold-deep:#5C86CC;
  --rule:#27324A; --ok:#5FC795; --ok-bg:#122A20; --warn:#F28A5B; --warn-bg:#2E1A13;
  --r:3px;
}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  letter-spacing:.006em;
}
/* one quiet gesture: night at the top, the first hint of morning at the very bottom */
body::before{
  opacity:1;
  background-image:linear-gradient(180deg,#080C14 0%,#0B1018 46%,#101726 84%,#17202E 100%);
}
h1,h2,h3{letter-spacing:-.018em}
.placename{font-family:inherit;font-style:normal;font-weight:650;letter-spacing:-.028em}

/* surfaces that were paper-white */
.panel,.stage,.choice,.orderrow,.card,.needle,.addmenu button,
input[type=text],input[type=number],input[type=password],textarea,select,.pills label{
  background:var(--slate);
}
.sub{background:#111826;border-color:var(--rule)}
.btn{background:var(--slate);border-color:var(--rule)}
.btn:hover{background:var(--shoal);border-color:var(--ink-soft)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#14100A;font-weight:700}
.btn.go:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:#FFFFFF}
.masthead{border-bottom:1px solid var(--rule)}
.tabs{border-bottom:1px solid var(--rule)}
.panel,.stage{border-width:1px;border-color:var(--rule)}
.elrow.on{background:var(--shoal);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.elrow:hover{background:#18202F}
.empty{border-color:var(--rule)}
#map{border-color:var(--rule);filter:saturate(.72) brightness(.82) contrast(1.06)}

/* the spine: this content genuinely is a sequence, so it gets a timeline */
.stage{position:relative;padding-left:34px}
.stage::before{
  content:"";position:absolute;left:12px;top:26px;bottom:22px;width:1px;background:var(--rule);
}
.stagehead{position:relative;gap:12px}
.stagehead .glyph{
  position:absolute;left:-34px;top:-1px;width:23px;height:23px;border-radius:50%;
  border:1px solid var(--accent);color:var(--accent);background:var(--paper);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.7rem;font-weight:600;
  box-shadow:0 0 0 4px var(--paper);
}
.stagehead .glyph.done{border-color:var(--gold);color:var(--gold)}
.tstamp{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;font-weight:600;
  color:var(--accent);letter-spacing:.04em;font-variant-numeric:tabular-nums;
}
.stagehead .glyph.done + .tstamp{color:var(--gold)}

.choice:hover{border-color:var(--ink-soft);background:var(--shoal)}
.choice.picked{border-color:var(--accent);background:var(--accent-tint)}
.flash{background:var(--shoal)}
.flash.info{color:var(--gold);border-left-color:var(--gold);background:#111A2B}
.needle{border-color:var(--rule)}
.dist{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.02em}
.countdown{font-family:ui-monospace,Menlo,Consolas,monospace}
.pip{border-color:var(--rule)}
.pip.now{box-shadow:0 0 0 3px rgba(242,166,62,.22)}
.pip.done::after{border-color:#0B1018}
.finish .bignum{
  font-family:ui-monospace,Menlo,Consolas,monospace;background:none;color:var(--accent);
  border:1px solid var(--accent);padding:10px 26px;font-weight:600;letter-spacing:-.02em;
}
.linkbox{background:#0F1624;border-color:var(--rule)}
.marker{background:rgba(242,166,62,.22)}
.card{border-style:solid;border-color:var(--rule)}
/* QR codes need a light quiet zone whatever the page is doing */
#qrbox img,#qrbox canvas,.card .qr img,.card .qr canvas{background:#fff;border:10px solid #fff;outline:none}
table.grid tr.top td{background:var(--accent-tint)}
.brandmark,.sitefoot img,.finish .brandblock img,.joinbrand img{
  background:#fff;border-radius:2px;padding:3px;
}
::placeholder{color:#63708C}
@media print{
  body{background:#fff !important;color:#0B1018 !important}
  .panel,.stage,.card,.sub{background:#fff !important;border-color:#999 !important}
  .tstamp,.stagehead .glyph{color:#0B1018 !important;border-color:#0B1018 !important}
}

/* ============================================================
   DAY SCHEME — overrides the night palette above.
   Same structure, same two jobs for colour: amber is the thing
   you press, blue is the cat and where you are. Both darkened
   so they hold on paper-white.
   ============================================================ */
:root{
  --ink:#131A28; --ink-soft:#5C6880; --paper:#F4F6FA; --slate:#FFFFFF;
  --shoal:#E9EEF7; --shoal-deep:#C9D4E6; --sand:#FBF3E2;
  --accent:#C77A0A; --accent-tint:#FBF0DD; --accent-dark:#A66208;
  --gold:#2E5EAA; --gold-deep:#24487F;
  --rule:#D8DEEA; --ok:#1F6B4F; --ok-bg:#E1EFE8; --warn:#9A4B12; --warn-bg:#F8EADF;
}
body::before{
  background-image:linear-gradient(180deg,#F7F9FC 0%,#F4F6FA 52%,#F6F4F0 88%,#F8F3EA 100%);
}
.panel,.stage,.choice,.orderrow,.card,.needle,.addmenu button,
input[type=text],input[type=number],input[type=password],textarea,select,.pills label{
  background:var(--slate);
}
.sub{background:#FAFBFE;border-color:var(--rule)}
.btn{background:var(--slate);border-color:var(--shoal-deep)}
.btn:hover{background:var(--shoal);border-color:var(--ink-soft)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#1A1206;font-weight:700}
.btn.go:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#FFFFFF}
.btn.primary{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.btn.primary:hover{background:#26324A}
.elrow:hover{background:var(--shoal)}
.elrow.on{background:var(--shoal);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
#map{filter:none;border-color:var(--shoal-deep)}
.stagehead .glyph{background:var(--paper);box-shadow:0 0 0 4px var(--paper)}
.flash{background:var(--shoal)}
.flash.info{color:var(--gold-deep);border-left-color:var(--gold);background:#EAF0FA}
.linkbox{background:#F1F4FA;border-color:var(--shoal-deep)}
.pip.done::after{border-color:#FFFFFF}
.marker{background:rgba(199,122,10,.22)}
.finish .bignum{color:var(--accent-dark);border-color:var(--accent)}
/* on a light page the logo needs no white chip behind it */
.brandmark,.sitefoot img,.finish .brandblock img,.joinbrand img{
  background:none;border-radius:0;padding:0;
}
::placeholder{color:#94A0B6}

.catpic{display:block;width:100%;max-width:420px;height:auto;margin:24px 0 4px}

.revealpic{margin:18px 0 6px;padding:0}
.revealpic img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:var(--r)}
.revealpic figcaption{margin-top:7px}
</style>

    ["name","nav","navAlt","arrive","prompt","answer","hint","reveal","kind"].forEach(function(k){ if(r[k]!=null) s[k]=r[k]; });
    if(!KINDS[s.kind]) s.kind="none";
    ["radius","tol","points"].forEach(function(k){ if(r[k]!=null) s[k]=num(r[k],s[k]); });
    s.lat = (r.lat==null||r.lat==="")?null:num(r.lat,null);
    s.lng = (r.lng==null||r.lng==="")?null:num(r.lng,null);
    if(Array.isArray(r.options)) s.options=r.options.map(function(o){
      return typeof o==="string"?{t:o,ok:false}:{t:o.t||"",ok:!!o.ok}; });
    out.stations.push(s);
  });
  if(!out.stations.length) out.stations=[newStation()];
  var ids={}; out.stations.forEach(function(s){ ids[s.id]=1; });
  (Array.isArray(h.routes)?h.routes:[]).forEach(function(r){
    if(!r||!Array.isArray(r.seq)) return;

  if(h.askNames===false) o.askNames=false;
  h.stations.forEach(function(s){
    var x={ id:s.id, name:s.name, lat:s.lat, lng:s.lng };
    ["nav","navAlt","arrive","prompt","answer","hint","reveal"].forEach(function(k){ if(s[k]) x[k]=s[k]; });
    if(s.kind!==d.kind) x.kind=s.kind;
    ["radius","tol","points"].forEach(function(k){ if(s[k]!==d[k]) x[k]=s[k]; });

/* Assigns every {{player}} slot in the team's route so that each name is used

var FIELDS=["nav","navAlt","arrive","prompt","reveal","hint"];
function buildNameSlots(){
  var p=S.prog, names=(p.players||[]).filter(function(n){ return n.trim(); });
  p.slots={};
  if(!names.length) return;
  var seq=routeSeq(), pool=shuffleSeeded(names,p.seed), k=0, cycle=pool.slice();
  seq.forEach(function(st){
    FIELDS.forEach(function(f){
      var n=(String(st[f]||"").match(/\{\{player\}\}/g)||[]).length;
      if(!n) return;
      if(!p.slots[st.id]) p.slots[st.id]={};
      p.slots[st.id][f]=[];
      for(var i=0;i<n;i++){
        if(!cycle.length) cycle=shuffleSeeded(pool,p.seed+(++k));
        p.slots[st.id][f].push(cycle.shift());
      }
    });
  });
}
function fill(text, station, field){
  if(!text) return "";
  var p=S.prog, names=(p&&p.players||[]).filter(function(n){return n.trim();});
  var per=(p&&p.slots&&station&&p.slots[station.id])||{};
  var slots=per[field]||[];
  var i=0;
  var out=String(text).replace(/\{\{player\}\}/g,function(){
    var n=slots[i++];
    if(n) return n;
    if(!names.length) return "one of you";
    return names[(fpNum(String(text))+i)%names.length];
  });
  out=out.replace(/\{\{everyone\}\}/g, names.length?listNames(names):"everyone");
  out=out.replace(/\{\{team\}\}/g, (p&&p.team)||"your team");
  return out;
}

function namesUsed(){
  var p=S.prog, used={};
  Object.keys(p.slots||{}).forEach(function(id){
    if((p.done||[]).indexOf(id)<0) return;
    var per=p.slots[id]||{};
    Object.keys(per).forEach(function(f){ (per[f]||[]).forEach(function(n){ used[n]=1; }); });
  });
  return used;
}
function namesLeft(){
  var used=namesUsed();
  return (S.prog.players||[]).filter(function(n){ return n.trim() && !used[n]; });
}

/* ========== route helpers ========== */
function stationById(id){
  for(var i=0;i<S.hunt.stations.length;i++) if(S.hunt.stations[i].id===id) return S.hunt.stations[i];
  return null;
}
function routeSeq(){
  var r=S.hunt.routes[(S.prog&&S.prog.route)||0]||S.hunt.routes[0];
  return (r.seq||[]).map(stationById).filter(Boolean);
}
function current(){ var q=routeSeq(); return q[S.prog.i]||null; }

/* ========== progress ========== */
function huntKey(){ return "wp:prog:"+fp(S.hunt.stations.map(function(s){return s.id;}).join()+S.hunt.title); }
function newProgress(){
  return { i:0, phase:"nav", begun:false, route:0, team:"", players:[],
           done:[], answers:{}, score:0, started:Date.now(), ended:null,
           hinted:[], overrides:[], seed:Math.floor(Math.random()*1e6)+1, slots:{} };
}
function loadProgress(){
  return store.get(huntKey()).then(function(raw){
    if(raw){ try{ S.prog=JSON.parse(raw); }catch(e){ S.prog=newProgress(); } }
    else S.prog=newProgress();
    return store.get(huntKey()+":media");
  }).then(function(raw){
    if(raw){ try{ MEDIA=JSON.parse(raw)||{}; }catch(e){ MEDIA={}; } }
  });
}
function saveProgress(){ if(S.prog&&!S.testing) store.set(huntKey(), JSON.stringify(S.prog)); }
function saveMedia(){ if(!S.testing) store.set(huntKey()+":media", JSON.stringify(MEDIA)).catch(function(){}); }

/* ========== boot ========== */
function paintLogos(){
  try{ Array.prototype.forEach.call(document.querySelectorAll("img[data-logo]"),
    function(el){ el.src=LOGO; }); }catch(e){}
}

function boot(){
  paintLogos();
  var hash=location.hash||"";
  var rm=hash.match(/[#&]r=(\d+)/);
  if(/[#&]play\b/.test(hash) && window.WAYPOINT_DEFAULT){
    try{
      S.hunt=repair(window.WAYPOINT_DEFAULT); accent(S.hunt.accent); S.screen="play";
      loadProgress().then(function(){
        if(rm && !S.prog.begun){ var ri=+rm[1]; if(S.hunt.routes[ri]){ S.prog.route=ri; S.prog.fixedRoute=true; } }
        render();
      });
      return;
    }catch(e){}
  }
  var m=hash.match(/[#&]h=([^&]+)/);
  if(m){
    try{
      S.hunt=repair(b64decode(m[1])); accent(S.hunt.accent); S.screen="play";
      var rm=(location.hash||"").match(/[#&]r=(\d+)/);
      loadProgress().then(function(){
        if(rm && !S.prog.begun){
          var ri=+rm[1];
          if(S.hunt.routes[ri]){ S.prog.route=ri; S.prog.fixedRoute=true; }
        }
        render();
      });
      return;
    }catch(e){ S.flash={kind:"bad",msg:"That hunt link is damaged and couldn't be opened."}; }
  }
  var draft=null;
  store.get("wp:draft").then(function(raw){ draft=raw; return store.get("wp:touched"); })
   .then(function(touched){
    if(draft && touched){ try{ S.hunt=repair(JSON.parse(draft)); }catch(e){} }
    else if(draft){ try{ S.stale=repair(JSON.parse(draft)); }catch(e){} }
    if(!S.hunt && window.WAYPOINT_DEFAULT){ try{ S.hunt=repair(window.WAYPOINT_DEFAULT); }catch(e){} }
    if(!S.hunt && S.stale){ S.hunt=S.stale; S.stale=null; }
    if(S.hunt) accent(S.hunt.accent);
    render();
  });
}
function accent(hex){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex||"")) hex="#B5175C";
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  var dk="#"+[r,g,b].map(function(c){return ("0"+Math.round(c*.78).toString(16)).slice(-2);}).join("");
  document.documentElement.style.setProperty("--accent",hex);
  document.documentElement.style.setProperty("--accent-dark",dk);
  document.documentElement.style.setProperty("--accent-tint","rgba("+r+","+g+","+b+",.13)");
}
function saveDraft(){
  if(!S.hunt) return;
  store.set("wp:draft", JSON.stringify(S.hunt));
  store.set("wp:touched","1");
}

/* ========== render chrome ========== */
function render(){
  stopLive();
  if(S.screen==="home") renderHome();
  else if(S.screen==="build") renderBuild();
  else if(S.screen==="play") renderPlay();
  else if(S.screen==="board") renderBoard();
  window.scrollTo(0,0);
}
function flashHTML(){ return S.flash?'<div class="flash '+S.flash.kind+'">'+esc(S.flash.msg)+"</div>":""; }
function stopLive(){
  if(LIVE.watch!==null){ try{ navigator.geolocation.clearWatch(LIVE.watch); }catch(e){} LIVE.watch=null; }
  if(LIVE.tick){ clearInterval(LIVE.tick); LIVE.tick=null; }
  if(LIVE.map){ try{ LIVE.map.remove(); }catch(e){} LIVE.map=null; LIVE.marker=null; }
  window.removeEventListener("deviceorientationabsolute", onHeading, true);
  window.removeEventListener("deviceorientation", onHeading, true);
}
function onHeading(e){
  var h=null;
  if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
  else if(e.absolute && e.alpha!=null) h=360-e.alpha;
  if(h==null) return;
  LIVE.heading=h;
  var n=$("#needle");
  if(n && LIVE.pos && S.prog.phase==="nav"){
    var st=current();
    if(st && st.lat!=null){
      var b=bearing(LIVE.pos.lat,LIVE.pos.lng,st.lat,st.lng);
      n.style.transform="rotate("+(b-h)+"deg)";
    }
  }
}

/* ========== player ========== */
function renderPlay(){
  var h=S.hunt, p=S.prog;
  navbtns.innerHTML = S.testing
    ? '<span class="tiny">Test run</span><button class="btn quiet sm" data-act="backtobuild">Back to building</button>'
    : (p.begun?'<button class="btn quiet sm" data-act="resetprog">Start again</button>':"");

  if(!p.begun){ renderJoin(); return; }
  var q=routeSeq();
  if(p.i>=q.length){ renderFinish(); return; }
  var st=q[p.i];

  var pips=q.map(function(s,i){
    return '<span class="pip'+(p.done.indexOf(s.id)>=0?" done":(i===p.i?" now":""))+'"></span>';
  }).join("");
  var head='<div style="padding-top:20px"><div class="punch">'+pips+"</div>"+
    '<div class="scorebar"><span><b>'+p.score+'</b> points</span>'+
    '<span><b>'+p.done.length+"</b> of "+q.length+" done</span>"+
    '<span>Elapsed <b class="countdown" id="elapsed">'+clock(Date.now()-p.started)+"</b></span></div></div>";

  if(p.phase==="nav") app.innerHTML='<div class="play-wrap">'+head+navCard(st,q)+"</div>";
  else if(p.phase==="task") app.innerHTML='<div class="play-wrap">'+head+taskCard(st)+"</div>";
  else app.innerHTML='<div class="play-wrap">'+head+revealCard(st,q)+"</div>";

  S.flash=null;
  LIVE.tick=setInterval(function(){
    var el=$("#elapsed"); if(el) el.textContent=clock(Date.now()-p.started);
  },1000);
  if(p.phase==="nav") startNav(st);
  var box=$("#ans");
  if(box){ box.focus(); box.addEventListener("keydown",function(e){ if(e.key==="Enter") checkAnswer(); }); }
}

/* ---- navigation ---- */
function startNav(st){
  if(st.lat==null||st.lng==null) return;
  if(window.L && $("#map")){
    try{
      LIVE.map=L.map("map",{zoomControl:true,attributionControl:true}).setView([st.lat,st.lng],16);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {maxZoom:19,attribution:"© OpenStreetMap"}).addTo(LIVE.map);
      L.circle([st.lat,st.lng],{radius:st.radius,color:"#B5175C",weight:2,fillOpacity:.12}).addTo(LIVE.map);
    }catch(e){ var m=$("#map"); if(m) m.style.display="none"; }
  }else{ var mm=$("#map"); if(mm) mm.style.display="none"; }

  if(!navigator.geolocation) return;
  LIVE.watch=navigator.geolocation.watchPosition(function(pos){
    LIVE.pos={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
    var d=metres(LIVE.pos.lat,LIVE.pos.lng,st.lat,st.lng);
    var de=$("#dist"), dw=$("#dirword");
    if(de) de.textContent=far(d);
    if(dw) dw.textContent="Head "+compassWord(bearing(LIVE.pos.lat,LIVE.pos.lng,st.lat,st.lng))+
      (LIVE.pos.acc?" · accurate to "+Math.round(LIVE.pos.acc)+" m":"");
    var n=$("#needle");
    if(n && LIVE.heading==null) n.style.transform="rotate("+bearing(LIVE.pos.lat,LIVE.pos.lng,st.lat,st.lng)+"deg)";
    if(LIVE.map){
      if(!LIVE.marker) LIVE.marker=L.circleMarker([LIVE.pos.lat,LIVE.pos.lng],{radius:7,color:"#0B2340",fillColor:"#0B2340",fillOpacity:1}).addTo(LIVE.map);
      else LIVE.marker.setLatLng([LIVE.pos.lat,LIVE.pos.lng]);
    }
  },function(){},{enableHighAccuracy:true,timeout:20000,maximumAge:5000});

  if(window.DeviceOrientationEvent){
    window.addEventListener("deviceorientationabsolute",onHeading,true);
    window.addEventListener("deviceorientation",onHeading,true);
  }
}
function checkGPS(){
  var st=current();
  if(!navigator.geolocation){ S.flash={kind:"bad",msg:"This browser can't read your location."}; S.tries=3; render(); return; }
  S.busy=true; render();
  navigator.geolocation.getCurrentPosition(function(pos){
    S.busy=false;
    var d=metres(pos.coords.latitude,pos.coords.longitude,st.lat,st.lng);
    var slack=Math.min(pos.coords.accuracy||0,25);
    if(d<=st.radius+slack){ S.tries=0; arrive(); }
    else{ S.tries++; S.flash={kind:"bad",msg:"Still about "+far(d)+" away. Keep walking."}; render(); }
  },function(err){
    S.busy=false; S.tries++;
    S.flash={kind:"bad",msg:err.code===1?"Location is blocked. Allow it for this page, then try again.":"No location fix yet — step into the open and try again."};
    render();
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function arrive(){
  var st=current();
  S.prog.phase = st.kind==="none" ? "reveal" : "task";
  if(st.kind==="none") complete(st,"arrived",true);
  else { saveProgress(); render(); }
}

/* ---- answering ---- */
function complete(st,value,ok){
  var p=S.prog;
  if(p.done.indexOf(st.id)<0){
    p.done.push(st.id);
    if(ok) p.score+=num(st.points,0);
  }
  p.answers[st.id]={ v:value, ok:!!ok, t:Date.now() };
  p.phase="reveal";
  saveProgress(); render();
}
function checkAnswer(){
  var st=current(), p=S.prog;
  if(st.kind==="none"){ complete(st,"arrived",true); return; }
  var box=$("#ans"), given=box?box.value:"";
  if(!given.trim()){ S.flash={kind:"info",msg:"Put something in the box first."}; render(); return; }
  var ok=false;
  if(st.kind==="number"){
    var g=parseFloat(String(given).replace(",","."));
    ok=String(st.answer).split("|").some(function(a){
      var t=parseFloat(a); return isFinite(g)&&isFinite(t)&&Math.abs(g-t)<=num(st.tol,0);
    });
  }else ok=matches(given,st.answer);
  if(ok) complete(st,given,true);
  else{ S.flash={kind:"bad",msg:"Not it. Look again — you can't move on until this is right."}; render(); }
}
function pickChoice(i){
  var st=current(), opts=st.options.filter(function(o){return o.t;});
  var o=opts[i];
  if(o&&o.ok) complete(st,o.t,true);
  else{ S.flash={kind:"bad",msg:"Not that one. Try again."}; render(); }
}
function useHint(){
  var st=current(), p=S.prog;
  if(p.hinted.indexOf(st.id)<0){ p.hinted.push(st.id); p.score=Math.max(0,p.score-num(S.hunt.hintCost,0)); }
  S.flash={kind:"info",msg:fill(st.hint,st,"hint")};
  saveProgress(); render();
}
function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1100, w=img.width, hgt=img.height;
      if(Math.max(w,hgt)>max){ var k=max/Math.max(w,hgt); w=Math.round(w*k); hgt=Math.round(hgt*k); }
      var c=document.createElement("canvas"); c.width=w; c.height=hgt;
      c.getContext("2d").drawImage(img,0,0,w,hgt);
      cb(c.toDataURL("image/jpeg",0.7));
    };
    img.onerror=function(){ cb(null); };
    img.src=r.result;
  };
  r.onerror=function(){ cb(null); };
  r.readAsDataURL(file);
}

/* ---- finish + report ---- */
function renderFinish(){
  var h=S.hunt, p=S.prog, q=routeSeq();
  if(!p.ended){ p.ended=Date.now(); saveProgress(); }
  var left=namesLeft();
  var extra = left.length
    ? '<div class="flash info" style="text-align:left">Before you claim the finish: '+esc(listNames(left))+
      ' never got called out by name during the walk. Put that right — one group photo where '+esc(listNames(left))+
      ' '+(left.length>1?"are":"is")+' front and centre, doing your best impression of a statue you passed today.</div>'
    : "";

function drawQR(el,text,size){
  if(!el) return;
  el.innerHTML="";
  if(typeof QRCode==="undefined"){ el.innerHTML='<p class="tiny">QR codes need a connection when the page loads.</p>'; return; }
  if(text.length>1100){ el.innerHTML='<p class="tiny" style="max-width:32ch;text-align:center">Too much hunt to fit in a QR code — send the link instead.</p>'; return; }
  try{ new QRCode(el,{text:text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ el.innerHTML='<p class="tiny">Too long for a QR code.</p>'; }
}

/* ========== events ========== */
document.addEventListener("click",function(e){
  var t;
  if((t=e.target.closest("[data-sel]"))){ S.sel=+t.getAttribute("data-sel"); render(); return; }
  if((t=e.target.closest("[data-tab]"))){ S.tab=t.getAttribute("data-tab"); render(); return; }
  if((t=e.target.closest("[data-route]"))){ S.routeSel=+t.getAttribute("data-route"); render(); return; }
  if((t=e.target.closest("[data-pick]"))){ pickChoice(+t.getAttribute("data-pick")); return; }
  var b=e.target.closest("[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act"), i=+b.getAttribute("data-i");
  var h=S.hunt, r=h&&h.routes[S.routeSel];

  if(a==="gopublish"){ S.screen="build"; S.tab="share"; render(); return; }
  if(a==="justplay"){ S.screen="play"; S.prog=newProgress(); render(); return; }
  if(a==="usestale"){
    S.hunt=S.stale; S.stale=null; accent(S.hunt.accent);
    S.sel=0; S.routeSel=0; S.tab="stations"; saveDraft(); S.screen="build"; render(); return;
  }
  if(a==="restore"){
    if(!confirm("Replace what is in this browser with the game built into the file?")) return;
    S.hunt=repair(window.WAYPOINT_DEFAULT); accent(S.hunt.accent);
    S.sel=0; S.routeSel=0; S.tab="stations"; saveDraft();
    S.screen="build"; render(); return;
  }
  if(a==="new"){ S.hunt=blankHunt(); accent(S.hunt.accent); S.screen="build"; S.tab="stations"; S.sel=0; saveDraft(); render(); }
  else if(a==="resume"){ S.screen="build"; S.tab="stations"; S.sel=0; render(); }
  else if(a==="home"){ S.screen="home"; S.testing=false; render(); }
  else if(a==="board"){ S.screen="board"; render(); }
  else if(a==="import") importFile();
  else if(a==="export") download((h.title||"hunt").replace(/[^\w\- ]+/g,"").slice(0,40)+".json", JSON.stringify(h,null,2));
  else if(a==="wipe"){ if(confirm("Throw this hunt away and start blank?")){ S.hunt=blankHunt(); S.sel=0; saveDraft(); render(); } }
  else if(a==="addstation"){ h.stations.push(newStation()); S.sel=h.stations.length-1; saveDraft(); render(); }
  else if(a==="del"){
    if(h.stations.length===1){ alert("A hunt needs at least one station."); return; }
    if(!confirm("Delete this station? It will be removed from every route too.")) return;
    var id=h.stations[S.sel].id;
    h.stations.splice(S.sel,1);
    h.routes.forEach(function(x){ x.seq=x.seq.filter(function(y){ return y!==id; }); });
    S.sel=Math.max(0,S.sel-1); saveDraft(); render();
  }
  else if(a==="dupe"){ var c=JSON.parse(JSON.stringify(h.stations[S.sel])); c.id=uid(); c.name+=" (copy)";
    h.stations.splice(S.sel+1,0,c); S.sel++; saveDraft(); render(); }
  else if(a==="up"||a==="down"){
    var j=a==="up"?S.sel-1:S.sel+1; if(j<0||j>=h.stations.length) return;
    var tmp=h.stations[S.sel]; h.stations[S.sel]=h.stations[j]; h.stations[j]=tmp; S.sel=j; saveDraft(); render();
  }
  else if(a==="addopt"){ h.stations[S.sel].options.push({t:"",ok:false}); saveDraft(); render(); }
  else if(a==="delopt"){ h.stations[S.sel].options.splice(i,1); saveDraft(); render(); }
  else if(a==="here"){
    if(!navigator.geolocation){ alert("No location available in this browser."); return; }
    b.textContent="Finding…";
    navigator.geolocation.getCurrentPosition(function(pos){
      var s=h.stations[S.sel];
      s.lat=+pos.coords.latitude.toFixed(6); s.lng=+pos.coords.longitude.toFixed(6);
      saveDraft(); render();
    },function(){ alert("No fix. Go outside and allow location for this page."); render(); },{enableHighAccuracy:true,timeout:15000});
  }
  else if(a==="addroute"){ h.routes.push({name:"Route "+String.fromCharCode(65+h.routes.length),seq:[]}); S.routeSel=h.routes.length-1; saveDraft(); render(); }
  else if(a==="delroute"){ if(h.routes.length===1){ alert("Keep at least one route."); return; }
    h.routes.splice(S.routeSel,1); S.routeSel=0; saveDraft(); render(); }
  else if(a==="raddst"){ var sel=$("#addst"); if(sel&&r){ r.seq.push(sel.value); saveDraft(); render(); } }
  else if(a==="rdel"){ r.seq.splice(i,1); saveDraft(); render(); }
  else if(a==="rup"||a==="rdown"){
    var k=a==="rup"?i-1:i+1; if(k<0||k>=r.seq.length) return;
    var q=r.seq[i]; r.seq[i]=r.seq[k]; r.seq[k]=q; saveDraft(); render();
  }
  else if(a==="rotate"){ rotateRoutes(); }
  else if(a==="copyshort"||a==="copylink"){
    var url=a==="copyshort"?shortURL(i):shareURL(i);
    var was=b.textContent;
    var done=function(){ b.textContent="Copied"; setTimeout(function(){ b.textContent=was; },1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,function(){ prompt("Copy:",url); });
    else prompt("Copy:",url);
  }
  else if(a==="rebake") rebake();
  else if(a==="sheet"){
    download((S.hunt.title||"hunt").replace(/[^\w\- ]+/g,"").slice(0,40)+" facilitator sheet.html", buildSheet(), "text/html");
  }
  else if(a==="testplay"){ S.testing=true; S.screen="play"; S.prog=newProgress(); MEDIA={}; render(); }
  else if(a==="backtobuild"){ S.testing=false; S.screen="build"; render(); }
  else if(a==="begin") beginGame();
  else if(a==="checkgps") checkGPS();
  else if(a==="override"){
    var st=current(); S.prog.overrides.push(st.id); S.tries=0; arrive();
  }
  else if(a==="arrived") arrive();
  else if(a==="check") checkAnswer();
  else if(a==="hint") useHint();
  else if(a==="submitphoto"){ var s2=current(); if(MEDIA[s2.id]) complete(s2,"photo submitted",true); }
  else if(a==="next"){
    S.prog.i++; S.prog.phase="nav"; S.tries=0; saveProgress(); render();
  }
  else if(a==="report"){ download((S.prog.team||"team").replace(/[^\w\- ]+/g,"")+" results.html", buildReport(), "text/html"); }
  else if(a==="copyresult"){
    var code=resultCode();
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(
      function(){ b.textContent="Copied — send it to your facilitator"; },function(){ prompt("Copy this:",code); });
    else prompt("Copy this:",code);
  }
  else if(a==="addcode"){
    var el=$("#code");
    try{ var d=b64decode(el.value.trim()); S.board.push(d); S.flash={kind:"good",msg:"Added "+(d.t||"team")+"."}; }
    catch(err){ S.flash={kind:"bad",msg:"That code didn't decode. Ask them to copy it again."}; }
    render();
  }
  else if(a==="clearboard"){ if(confirm("Clear the scoreboard?")){ S.board=[]; render(); } }
  else if(a==="resetprog"){
    if(!confirm("Wipe this team's progress and start the hunt again?")) return;
    S.prog=newProgress(); MEDIA={}; saveProgress(); saveMedia(); render();
  }
});

function beginGame(){
  var h=S.hunt, p=S.prog;
  var team=$("#team"), names=[].slice.call(document.querySelectorAll(".pname")).map(function(x){ return x.value.trim(); });
  var picked=document.querySelector('input[name="route"]:checked');
  p.route = picked?+picked.value:(p.route||0);
  p.team = team?team.value.trim():"";
  p.players = names.filter(function(n){ return n; });
  if(!p.team){ S.flash={kind:"bad",msg:"Give the team a name first."}; render(); return; }
  if(h.askNames && p.players.length<h.minPlayers){
    S.flash={kind:"bad",msg:"This game needs at least "+h.minPlayers+" names."}; render(); return;
  }
  p.begun=true; p.started=Date.now(); p.phase="nav"; p.i=0;
  buildNameSlots();
  saveProgress(); render();
}

function rotateRoutes(){
  var h=S.hunt, base=h.routes[S.routeSel];
  if(!base||base.seq.length<3){ alert("Build one full route first, then rotate it."); return; }
  var n=Math.max(2,Math.min(12,+($("#nrot").value)||5));
  var pin=$("#pinends").value;
  var first=pin!=="none"?base.seq[0]:null;
  var last=pin==="both"?base.seq[base.seq.length-1]:null;
  var mid=base.seq.slice(first?1:0, last?base.seq.length-1:base.seq.length);
  var out=[];
  for(var k=0;k<n;k++){
    var off=Math.round(k*mid.length/n);
    var dir=k%2===0?1:-1;
    var seq=[];
    for(var i=0;i<mid.length;i++){
      var idx=((off+dir*i)%mid.length+mid.length)%mid.length;
      seq.push(mid[idx]);
    }
    out.push({ name:"Route "+String.fromCharCode(65+k), seq:(first?[first]:[]).concat(seq, last?[last]:[]) });
  }
  h.routes=out; S.routeSel=0; saveDraft(); render();
}

function importFile(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        S.hunt=repair(JSON.parse(rd.result)); accent(S.hunt.accent);
        S.screen="build"; S.tab="stations"; S.sel=0; S.routeSel=0;
        S.flash={kind:"good",msg:"Hunt opened."}; saveDraft(); render();
      }catch(e){ S.flash={kind:"bad",msg:"That file wasn't made by Scenic Route."}; render(); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

document.addEventListener("input",function(e){
  var el=e.target, h=S.hunt; if(!h) return;
  var f=el.getAttribute&&el.getAttribute("data-f");
  if(f){
    var s=h.stations[S.sel], v=el.value;
    if(f==="points"||f==="radius"||f==="tol") v=num(v,0);
    if(f==="lat"||f==="lng") v=v.trim()===""?null:num(v,null);
    s[f]=v;
    if(f==="name"){ var row=document.querySelector('[data-sel="'+S.sel+'"] .elname'); if(row) row.textContent=v||"Untitled"; }
    saveDraft(); return;
  }
  var o=el.getAttribute&&el.getAttribute("data-opt");
  if(o!==null&&o!==undefined){ h.stations[S.sel].options[+o].t=el.value; saveDraft(); return; }
  var rn=el.getAttribute&&el.getAttribute("data-r");
  if(rn){ h.routes[S.routeSel][rn]=el.value; saveDraft(); render(); return; }
  var hk=el.getAttribute&&el.getAttribute("data-h");
  if(hk){
    if(hk==="askNames") h[hk]=el.checked;
    else if(["minPlayers","maxPlayers","hintCost"].indexOf(hk)>=0) h[hk]=num(el.value,0);
    else h[hk]=el.value;
    if(hk==="accent") accent(el.value);
    saveDraft();
  }
});

document.addEventListener("change",function(e){
  var el=e.target, h=S.hunt;
  if(el.name==="kind"&&h){ h.stations[S.sel].kind=el.value; saveDraft(); render(); return; }
  var ok=el.getAttribute&&el.getAttribute("data-ok");
  if(ok!==null&&ok!==undefined&&h){ h.stations[S.sel].options[+ok].ok=el.checked; saveDraft(); return; }
  if(el.id==="shot"&&el.files&&el.files[0]){
    var st=current();
    var lab=document.querySelector('label[for="shot"]');
    if(lab) lab.textContent="Processing…";
    shrink(el.files[0],function(data){
      if(!data){ S.flash={kind:"bad",msg:"That image wouldn't load. Try again."}; render(); return; }
      MEDIA[st.id]=data; saveMedia(); render();
    });
  }
});


/* ===== export: a ready-to-host copy, and the facilitator sheet ===== */
function stationLabel(i){
  var h=S.hunt, id=h.stations[i].id;
  var everyFirst=h.routes.length&&h.routes.every(function(r){ return r.seq[0]===id; });
  var everyLast =h.routes.length&&h.routes.every(function(r){ return r.seq[r.seq.length-1]===id; });
  if(everyFirst) return "START";
  if(everyLast)  return "FINISH";
  var n=0;
  for(var k=0;k<=i;k++){
    var kid=h.stations[k].id;
    var kf=h.routes.length&&h.routes.every(function(r){ return r.seq[0]===kid; });
    var kl=h.routes.length&&h.routes.every(function(r){ return r.seq[r.seq.length-1]===kid; });
    if(!kf&&!kl) n++;
  }
  return "S"+n;
}
function labelOf(id){
  for(var i=0;i<S.hunt.stations.length;i++) if(S.hunt.stations[i].id===id) return stationLabel(i);
  return "?";
}
/* Google Maps allows ten stops per set of directions, so chunk with a one-stop overlap */
function mapLinks(seq){
  var st=seq.map(stationById).filter(function(s){ return s&&s.lat!=null; });
  var out=[], i=0;
  while(i<st.length-1){
    var chunk=st.slice(i,i+10);
    if(chunk.length<2) break;
    var u="https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+chunk[0].lat+","+chunk[0].lng+
          "&destination="+chunk[chunk.length-1].lat+","+chunk[chunk.length-1].lng;
    var w=chunk.slice(1,-1);
    if(w.length) u+="&waypoints="+w.map(function(s){ return s.lat+","+s.lng; }).join("%7C");
    out.push({ from:i+1, to:i+chunk.length, url:u });
    i+=chunk.length-1;
  }
  return out;
}
function answerText(s){
  if(s.kind==="choice"){ var o=s.options.filter(function(x){return x.ok&&x.t;})[0]; return o?o.t:"—"; }
  if(s.kind==="number") return s.answer+(s.tol?" (accept ±"+s.tol+")":"");
  if(s.kind==="text"){ var a=String(s.answer).split("|");
    return a[0]+(a.length>1?"   [also accepts: "+a.slice(1).join(", ")+"]":""); }
  if(s.kind==="photo") return "Photo — always accepted, review it afterwards";
  return "Nothing to answer";
}
function buildSheet(){
  var h=S.hunt, n=h.routes.length?h.routes[0].seq.length:0;
  var grid="";
  if(h.routes.length){
    grid='<table><tr><th>Step</th>'+h.routes.map(function(r){return "<th>"+esc(r.name)+"</th>";}).join("")+"</tr>";
    for(var i=0;i<n;i++){
      grid+='<tr><td class=step>'+(i+1)+"</td>"+h.routes.map(function(r){
        var s=stationById(r.seq[i]);
        return "<td><b>"+(s?labelOf(s.id):"—")+"</b> "+esc(s?s.name:"")+"</td>";
      }).join("")+"</tr>";
    }
    grid+="</table>";
  }
  var blocks=h.routes.map(function(r){
    var tot=0, rows="";
    r.seq.forEach(function(id,i){
      var s=stationById(id); if(!s) return;
      var leg="—";
      if(i<r.seq.length-1){ var nx=stationById(r.seq[i+1]);
        if(nx&&s.lat!=null&&nx.lat!=null){ var d=metres(s.lat,s.lng,nx.lat,nx.lng)*1.25; tot+=d; leg=Math.round(d)+" m"; } }
      rows+='<tr><td class=step>'+(i+1)+"</td><td><b>"+labelOf(id)+"</b></td><td>"+esc(s.name)+
        "</td><td>"+esc(KINDS[s.kind])+'</td><td class=num>'+leg+"</td></tr>";
    });
    var links=mapLinks(r.seq).map(function(l){
      return '<a class=maplink target=_blank rel=noopener href="'+l.url+'">Stops '+l.from+"–"+l.to+" in Google Maps</a>";
    }).join("");
    var first=stationById(r.seq[1])||stationById(r.seq[0]);
    var open=first?(first.navAlt||first.nav):"";
    return "<h3 class=rh>"+esc(r.name)+"</h3>"+
      '<p class=meta>'+(tot/1000).toFixed(1)+" km on foot · starts at "+esc(first?first.name:"")+"</p>"+
      (open?'<p class=open><b>Opening leg:</b> '+esc(open)+"</p>":"")+
      '<p class=links>'+links+"</p>"+
      '<table class=rt><tr><th>Step</th><th>Ref</th><th>Station</th><th>Type</th><th>To next</th></tr>'+rows+"</table>";
  }).join("");
  var cards=h.stations.map(function(s,i){
    return "<section><h3>"+stationLabel(i)+" · "+esc(s.name)+"</h3>"+
      '<p class=meta>'+(s.lat==null?"no coordinates set":s.lat+", "+s.lng+" · arrive within "+s.radius+" m")+
      " · "+esc(KINDS[s.kind])+" · "+s.points+" pts"+
      (s.lat==null?"":' · <a target=_blank rel=noopener href="https://www.google.com/maps/search/?api=1&query='+s.lat+","+s.lng+'">Google Maps</a>'+
        ' · <a target=_blank rel=noopener href="https://www.openstreetmap.org/?mlat='+s.lat+"&mlon="+s.lng+"#map=18/"+s.lat+"/"+s.lng+'">OSM</a>')+
      "</p>"+
      (s.nav?'<p><span class=k>Walking clue</span> '+esc(s.nav)+"</p>":"")+
      (s.navAlt?'<p><span class=k>If first stop</span> '+esc(s.navAlt)+"</p>":"")+
      (s.prompt?'<p><span class=k>Task</span> '+esc(s.prompt)+"</p>":"")+
      '<p><span class=k>Answer</span> <b class=ans>'+esc(answerText(s))+"</b></p>"+
      (s.hint?'<p><span class=k>Hint (−'+h.hintCost+")</span> "+esc(s.hint)+"</p>":"")+
      "</section>";
  }).join("");
  return "<!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'>"+
    "<title>"+esc(h.title)+" — facilitator sheet</title><style>"+
    "body{font-family:system-ui,-apple-system,sans-serif;max-width:1000px;margin:26px auto;padding:0 18px;color:#0B2340;line-height:1.45}"+
    "h1{margin:0 0 4px;font-size:1.7rem}h2{margin:32px 0 8px;font-size:1.15rem;border-bottom:2px solid #0B2340;padding-bottom:4px}"+
    "h3{margin:16px 0 3px;font-size:1rem}h3.rh{margin-top:26px;font-size:1.1rem;color:#B5175C}"+
    "table{border-collapse:collapse;width:100%;font-size:.8rem;margin-top:8px}"+
    "th,td{border:1px solid #C7D2DA;padding:4px 6px;text-align:left;vertical-align:top}th{background:#D3E3DE}"+
    "td.step{background:#F3F6F5;text-align:center;font-weight:700;width:3em}td.num{text-align:right;color:#3F5D77}"+
    "table.rt{max-width:660px}section{border-bottom:1px solid #eee;padding-bottom:10px;break-inside:avoid}"+
    ".meta{color:#3F5D77;font-size:.83rem;margin:2px 0 6px}p{margin:4px 0}"+
    ".k{display:inline-block;min-width:96px;color:#3F5D77;font-size:.8rem;font-weight:600}.ans{color:#B5175C}"+
    ".links{margin:8px 0 2px}a.maplink{display:inline-block;margin:0 8px 6px 0;padding:6px 11px;border:1.5px solid #B5175C;"+
    "border-radius:3px;color:#B5175C;text-decoration:none;font-size:.82rem;font-weight:600}a.maplink:hover{background:#F6E3EC}"+
    "@media print{body{margin:0;font-size:10pt}h2{page-break-after:avoid}a.maplink{border:none;padding:0}}"+
    "img.brand{height:60px;width:auto;margin:0 0 10px}"+
    "</style></head><body>"+
    '<img class="brand" src="'+LOGO+'" alt="">'+
    "<h1>"+esc(h.title)+" — facilitator sheet</h1>"+
    '<p class=meta>'+h.stations.length+" stations · "+h.routes.length+" routes"+
    " · hint costs "+h.hintCost+" points · generated "+new Date().toISOString().slice(0,10)+"</p>"+
    (grid?"<h2>Who goes where, and when</h2><p>Read down a column for one team&rsquo;s route. Read across a row to see where every team is at the same moment.</p>"+grid:"")+
    (blocks?"<h2>Route by route, with maps</h2><p>Google Maps allows ten stops per set of directions, so long routes come as several links that overlap by one stop.</p>"+blocks:"")+
    "<h2>Every station</h2>"+cards+"</body></html>";
}
function rebake(){
  var name=(S.hunt.title||"hunt").replace(/[^\w\- ]+/g,"").slice(0,40);
  var M1="/*HUNT_"+"START*/", M2="/*HUNT_"+"END*/";
  var _b=new TextEncoder().encode(JSON.stringify(S.hunt)),_s="";
  for(var _i=0;_i<_b.length;_i++)_s+=String.fromCharCode(_b[_i]);
  var json=btoa(_s);
  function bake(txt){
    if(!txt) return null;
    var a=txt.indexOf(M1), b=txt.indexOf(M2);
    if(a<0||b<0) return null;
    return txt.slice(0,a)+M1+'window.WAYPOINT_B64="'+json+'";'+txt.slice(b);
  }
  /* the page keeps a pristine copy of itself taken before it drew anything,
     so this works offline, from a hard drive, and inside preview frames */
  var out=bake(PRISTINE);
  if(out){
    download(name+".html", out, "text/html");
    S.flash={kind:"good",msg:"Downloaded. Rename it to index.html and upload it over the one on your host — every team link will then serve this version."};
    render(); return;
  }
  fetch(location.href,{cache:"no-store"}).then(function(r){ return r.text(); }).then(function(txt){
    var o=bake(txt);
    if(!o) throw new Error("markers");
    download(name+".html", o, "text/html");
    S.flash={kind:"good",msg:"Downloaded. Rename it to index.html and upload it over the one on your host."};
    render();
  }).catch(function(){
    S.flash={kind:"bad",msg:"Could not rebuild the file in this browser. Use Download hunt file instead and send the .json on."};
    render();
  });
}


var PRISTINE="";
try{ PRISTINE="<!DOCTYPE html>\n"+document.documentElement.outerHTML; }catch(e){}

boot();
})();
